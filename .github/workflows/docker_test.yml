name: termux-wheels
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Build in Termux container
        run: |
          docker run --name tb \
            termux/termux-docker:aarch64 bash -c '
            set -e
            export ANDROID_API_LEVEL=24
            pkg update -y && pkg install -y python rust clang binutils maturin
            mkdir ~/src && cd ~/src
            pip download zensical --no-binary :all: --no-deps
            tar xf *.tar.gz && cd */
            maturin build --release -o ~/wheels
            cd ~/wheels
            for w in *.whl; do
              case "$w" in *android_24_arm64_v8a.whl) ;; *) echo "BAD TAG: $w"; exit 1;; esac
              unzip -Z1 "$w" | grep "\.so$" | while read s; do
                unzip -p "$w" "$s" > ~/x.so; echo "== $s"; readelf -d ~/x.so | grep NEEDED
              done
            done
          '

      - name: Copy wheels out
        run: |
          mkdir out
          docker cp tb:/data/data/com.termux/files/home/wheels/. out/
          ls out

      - uses: actions/upload-artifact@v4
        with:
          name: termux-wheels
          path: out/*.whl
